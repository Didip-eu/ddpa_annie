[project]
name = "ddpa_annie"
version = "0.1.0"
description = "ANNIE for Monasterium NG: the annotation logic (annie_core)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["annie_core"]
